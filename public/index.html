<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TikTok Live Notifier</title>
<style>
  :root { --bg:#0e1116; --card:#171b22; --line:#242a34; --fg:#e6e9ef; --dim:#8b93a1; --live:#ff2d55; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 ui-sans-serif,system-ui,"Segoe UI",sans-serif; }
  header { display:flex; flex-wrap:wrap; gap:4px 14px; align-items:baseline; padding:16px 24px; border-bottom:1px solid var(--line); }
  h1 { font-size:15px; margin:0; letter-spacing:.02em; }
  header span { color:var(--dim); font-size:12px; }
  main { max-width:1100px; margin:0 auto; padding:24px; }
  .grid { display:grid; gap:12px; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); }
  .card { display:flex; gap:12px; padding:14px; background:var(--card); border:1px solid var(--line); border-radius:10px; }
  .card.live { border-color:var(--live); }
  .avatar { width:44px; height:44px; flex:none; border-radius:50%; object-fit:cover; background:#222; }
  .top { display:flex; align-items:center; gap:8px; }
  .name { font-weight:600; }
  .badge { padding:1px 7px; border-radius:99px; background:#2a2f3a; color:var(--dim); font-size:11px; }
  .badge.live { background:var(--live); color:#fff; }
  .badge.err { background:#4a3410; color:#f5c451; }
  .meta { margin-top:4px; color:var(--dim); font-size:12px; word-break:break-word; }
  h2 { margin:28px 0 10px; color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:.09em; }
  .events { display:flex; flex-direction:column; gap:6px; }
  .event { display:flex; gap:10px; padding:8px 10px; background:var(--card); border:1px solid var(--line); border-radius:8px; font-size:13px; }
  .event time { margin-left:auto; color:var(--dim); white-space:nowrap; }
  .empty { color:var(--dim); }
</style>
</head>
<body>
<header>
  <h1>TikTok Live Notifier</h1>
  <span id="meta">loading...</span>
</header>
<main>
  <div class="grid" id="creators"></div>
  <h2>Activity</h2>
  <div class="events" id="events"></div>
</main>
<script>
const esc = value => String(value ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))

const ago = ts => {
  if (!ts) return 'never checked'
  const s = Math.round((Date.now() - ts) / 1000)
  if (s < 60) return `checked ${s}s ago`
  if (s < 3600) return `checked ${Math.round(s / 60)}m ago`
  return `checked ${Math.round(s / 3600)}h ago`
}

const uptime = start => {
  const s = Math.floor((Date.now() - start) / 1000)
  const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60)
  return d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : `${m}m`
}

const card = (creator, s) => {
  const state = s?.error ? 'err' : s?.live ? 'live' : ''
  const label = s?.error ? 'error' : s?.live ? 'live' : 'offline'
  const detail = s?.error
    ? esc(s.error)
    : s?.live
      ? `${s.viewers ?? 0} viewers${s.title ? ` · ${esc(s.title)}` : ''}`
      : 'no stream right now'
  return `<div class="card ${state}">
    <img class="avatar" src="${esc(s?.avatar || '')}" alt="" onerror="this.style.visibility='hidden'">
    <div>
      <div class="top">
        <span class="name">${esc(s?.nickname || creator)}</span>
        <span class="badge ${state}">${label}</span>
      </div>
      <div class="meta">@${esc(creator)}</div>
      <div class="meta">${detail}</div>
      <div class="meta">${ago(s?.checkedAt)}</div>
    </div>
  </div>`
}

const row = event => `<div class="event">
  <span>${event.type === 'live' ? '🔴' : event.type === 'offline' ? '⚫' : '➕'}</span>
  <span>@${esc(event.creator)} ${event.type === 'live' ? 'went live' : event.type === 'offline' ? 'ended the live' : 'added'}${event.viewers ? ` · ${event.viewers} viewers` : ''}</span>
  <time>${new Date(event.at).toLocaleTimeString()}</time>
</div>`

const render = data => {
  const channelCount = Object.keys(data.channels).length
  document.getElementById('meta').textContent =
    `${data.creators.length} tracked · alerts ${channelCount ? `on (${channelCount} server${channelCount === 1 ? '' : 's'})` : 'off'} · every ${data.pollSeconds}s · up for ${uptime(data.startedAt)}`

  const grid = document.getElementById('creators')
  grid.innerHTML = data.creators.length
    ? data.creators.map(c => card(c.username, data.status[c.username])).join('')
    : '<div class="empty">Nothing tracked yet. Run /track add in Discord.</div>'

  const events = document.getElementById('events')
  events.innerHTML = data.events.length
    ? data.events.map(row).join('')
    : '<div class="empty">No activity yet.</div>'
}

const poll = async () => {
  try {
    render(await (await fetch('/api/status')).json())
  } catch (e) {
    document.getElementById('meta').textContent = 'bot unreachable'
  }
}

poll()
setInterval(poll, 5000)
</script>
</body>
</html>
